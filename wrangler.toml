name = "blinkboard"
main = "src/index.js"
compatibility_date = "2026-09-03"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[vars]
PUBLIC_ORIGIN = "https://blinkboard.pages.dev"
BOT_USERNAME = ""
EUR_USD = "1.08"
STAR_USD = "0.013"

[[d1_databases]]
binding = "DB"
database_name = "blinkboard"
database_id = "47d31032-ae0a-4959-b1e0-f314ab571819"

[triggers]
crons = ["*/5 * * * *"]
